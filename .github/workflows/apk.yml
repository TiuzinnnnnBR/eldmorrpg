name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar o jogo para dentro do app
        run: |
          SRC=$(dirname "$(find . -name manifest.webmanifest -not -path './android/*' -not -path './.git/*' | head -1)")
          echo "Jogo encontrado em: $SRC"
          rm -rf /tmp/jogo && mkdir -p /tmp/jogo
          (cd "$SRC" && tar --exclude=./android --exclude=./.git --exclude=./.github -cf - .) | (cd /tmp/jogo && tar -xf -)
          rm -rf android/app/src/main/assets/game
          mkdir -p android/app/src/main/assets/game
          cp -r /tmp/jogo/. android/app/src/main/assets/game/
          rm -f android/app/src/main/assets/game/LEIA-ME*.txt
          ls android/app/src/main/assets/game

      - name: Compilar o APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk ReinosDeEldmor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReinosDeEldmor-APK
          path: ReinosDeEldmor.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Reinos de Eldmor (Android) ${{ github.run_number }}
          body: Baixe o arquivo ReinosDeEldmor.apk abaixo e abra no celular Android para instalar.
          files: ReinosDeEldmor.apk
