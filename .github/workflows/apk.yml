name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Copiar o jogo para dentro do app
        run: |
          SRC=$(dirname "$(find . -name manifest.webmanifest -not -path './android/*' -not -path './.git/*' | head -1)")
          echo "Jogo encontrado em: $SRC"
          rm -rf /tmp/jogo && mkdir -p /tmp/jogo
          (cd "$SRC" && tar --exclude=./android --exclude=./.git --exclude=./.github --exclude=./windows --exclude=./vid -cf - .) | (cd /tmp/jogo && tar -xf -)
          rm -rf android/app/src/main/assets/game
          mkdir -p android/app/src/main/assets/game
          cp -r /tmp/jogo/. android/app/src/main/assets/game/
          rm -f android/app/src/main/assets/game/LEIA-ME*.txt
          ls android/app/src/main/assets/game

      - name: Compilar o APK (versão do site)
        working-directory: android
        run: gradle assembleSiteRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/site/release/app-site-release.apk ReinosDeEldmor.apk

      # Versão da Google Play Store (.aab). Só é gerada depois que os segredos PLAY_KEYSTORE e PLAY_KS_PASS
      # forem cadastrados no GitHub (Settings > Secrets and variables > Actions).
      - name: Compilar a versão da Play Store
        env:
          PLAY_KEYSTORE: ${{ secrets.PLAY_KEYSTORE }}
          PLAY_KS_PASS: ${{ secrets.PLAY_KS_PASS }}
        run: |
          if [ -n "$PLAY_KEYSTORE" ]; then echo "$PLAY_KEYSTORE" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload.jks"; export PLAY_KS_FILE="$RUNNER_TEMP/upload.jks"; fi
          (cd android && gradle bundlePlayRelease --no-daemon)
          if [ -n "$PLAY_KEYSTORE" ]; then cp android/app/build/outputs/bundle/playRelease/app-play-release.aab ReinosDeEldmor-PlayStore.aab; else echo "Versão da Play compilada, mas sem a chave de envio: o .aab não foi publicado"; fi
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ReinosDeEldmor-APK
          path: ReinosDeEldmor.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Reinos de Eldmor (Android) ${{ github.run_number }}
          body: Baixe o arquivo ReinosDeEldmor.apk abaixo e abra no celular Android para instalar.
          files: |
            ReinosDeEldmor.apk
            ReinosDeEldmor-PlayStore.aab
          fail_on_unmatched_files: false

  windows:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar a versão para Windows
        shell: pwsh
        run: |
          $v = "33.2.1"
          Invoke-WebRequest "https://github.com/electron/electron/releases/download/v$v/electron-v$v-win32-x64.zip" -OutFile electron.zip
          $d = "out\Reinos de Eldmor"
          New-Item -ItemType Directory -Force $d | Out-Null
          Expand-Archive electron.zip -DestinationPath $d
          Rename-Item "$d\electron.exe" "Reinos de Eldmor.exe"
          Remove-Item "$d\resources\default_app.asar" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$d\resources\app\game" | Out-Null
          Copy-Item windows\main.js, windows\package.json "$d\resources\app\"
          Copy-Item windows\LEIA-ME.txt "$d\"
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('android','windows','out','.git','.github','electron.zip','rcedit.exe') } | Copy-Item -Destination "$d\resources\app\game" -Recurse -Force
          Remove-Item "$d\resources\app\game\site.html","$d\resources\app\game\loja.html" -ErrorAction SilentlyContinue
          Remove-Item "$d\resources\app\game\img" -Recurse -ErrorAction SilentlyContinue
          Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
          .\rcedit.exe "$d\Reinos de Eldmor.exe" --set-icon windows\icon.ico --set-version-string ProductName "Reinos de Eldmor" --set-version-string FileDescription "Reinos de Eldmor"
          Compress-Archive -Path $d -DestinationPath ReinosDeEldmor-Windows.zip

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: ReinosDeEldmor-Windows.zip
