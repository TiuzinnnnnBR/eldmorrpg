name: Publicar site na Hostinger
on:
  push:
    branches: [main]
    paths: ['hostinger-site/**', '.github/workflows/hostinger.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir segredos
        id: chk
        env:
          S: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$S" ]; then echo "Segredos FTP ainda não cadastrados; pulando."; echo "ok=0" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi
      - name: Limpar endereco do servidor
        if: steps.chk.outputs.ok == '1'
        env:
          S: ${{ secrets.FTP_SERVER }}
        run: |
          H=$(printf '%s' "$S" | tr -d ' \t\r\n' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          echo "::add-mask::$H"
          echo "Tamanho do endereco: ${#H} caracteres"
          if [[ "$H" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Formato: IP valido"; elif [[ "$H" == *.* ]]; then echo "Formato: nome de dominio"; else echo "::error::FTP_SERVER nao parece um IP nem um dominio. Confira se colou o 'IP do FTP (host)'."; exit 1; fi
          echo "FTPH=$H" >> $GITHUB_ENV
      - name: Descobrir a pasta do site
        if: steps.chk.outputs.ok == '1'
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          FULL: ${{ contains(github.event.head_commit.message, '[envio-completo]') && '1' || '0' }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          L(){ lftp -u "$U,$P" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; cls -1a $1; bye" "$FTPH" 2>/dev/null | sed 's#/$##' | xargs -n1 basename 2>/dev/null | sort; }
          echo "== Raiz do FTP =="; R=$(L .); echo "$R"
          if echo "$R" | grep -qxE 'loja.html|wds|index.html|site.html'; then
            echo "A raiz do FTP já é a pasta do site."; D=./
            if echo "$R" | grep -qx public_html; then echo "(existe uma pasta public_html extra aqui dentro, criada pelos envios antigos; pode ser apagada)"; fi
          elif echo "$R" | grep -qx public_html; then
            echo "== Dentro de public_html =="; L public_html | head -40; D=./public_html/
          else D=./; fi
          if [ "$FULL" = "1" ]; then lftp -u "$U,$P" -e "set ssl:verify-certificate no; rm -f ${D}.ftp-deploy-sync-state.json; bye" "$FTPH" && echo "Envio completo forçado."; fi
          echo "Pasta escolhida: $D"; echo "FTPDIR=$D" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'
      - name: Enviar por FTP
        if: steps.chk.outputs.ok == '1'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTPH }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./hostinger-site/
          server-dir: ${{ env.FTPDIR }}
