name: Diagnostico Hostinger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-hostinger.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ver o site publicado
        run: |
          U=https://mediumblue-llama-752104.hostingersite.com
          for p in / /site.html /loja.html /jogo.html /eld2.css; do
            echo "=== $p"; curl -s -D - -o /tmp/b "$U$p?nc=$RANDOM" | grep -iE '^(HTTP|cache|x-|age|last-mod|server|platform|panel)' ; echo "bytes $(wc -c </tmp/b)"; grep -o 'Relíquias de Eldmor\|eld2.css\|data-page="[a-z]*"\|hero2' /tmp/b | sort | uniq -c | head
          done
      - name: Ver os arquivos por FTP
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          H=$(printf '%s' "$H" | tr -d ' \t\r\n')
          L(){ lftp -u "$U,$P" -e "set ssl:verify-certificate no; $1; bye" "$H" 2>&1; }
          echo "== pwd"; L pwd | sed "s/$U/USUARIO/g"
          echo "== ls .."; L "cls -1 .." | sed "s/$U/USUARIO/g"
          echo "== ls ../.."; L "cls -1 ../.." | sed "s/$U/USUARIO/g" | head -30
          echo "== ls ../../.."; L "cls -1 ../../.." | sed "s/$U/USUARIO/g" | head -30
          for d in .. ../.. ; do for x in $(L "cls -1 $d" | grep -v '^\.' ); do :; done; done
