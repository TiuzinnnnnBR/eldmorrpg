<body>
<style>
/* Layout: mundo em tela cheia; HUD estilo Rucoy (status no topo esquerdo, classes em coluna à esquerda, habilidades embaixo à direita); menu em tela cheia estilo Dungeons. Visual escuro único, por escolha. */
:root{
  --bg:#0d0b14; --panel:rgba(21,17,32,.9); --panel-solid:#171224; --panel-2:#1f1830; --edge:#4a3d63; --edge-hi:#6d5b8f;
  --fg:#f1e7d0; --muted:#a597bd; --gold:#f2b84b; --ember:#ff8a3d; --hp:#e0483e; --mp:#4f8ff0; --xp:#8bd86a;
  --r0:#d6d0c4; --r1:#5aa8ff; --r2:#c36bff; --r3:#ffb43c;
  --display:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --body:"Nunito", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.panel{background:var(--panel);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 4px 0 rgba(0,0,0,.35);border-radius:3px}
.hud{position:fixed;z-index:5;pointer-events:none}
button{font-family:inherit}
/* status */
#tl{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px, env(safe-area-inset-left,0px));width:min(250px,52vw);padding:8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 8px;align-items:center;pointer-events:auto}
.lv{grid-row:span 3;width:36px;height:36px;display:grid;place-items:center;background:#2a2140;border:2px solid var(--gold);color:var(--gold);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.bar{position:relative;display:block;width:100%;height:13px;padding:0;margin:0;background:#0b0912;border:1px solid #000;overflow:hidden;color:var(--fg);text-align:left}
button.bar{height:21px;border:2px solid #000;cursor:pointer;touch-action:manipulation}
button.bar:hover{border-color:#3a2e50}
button.bar:active{filter:brightness(1.35)}
button.bar:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.bar i{position:absolute;top:0;bottom:0;left:0;width:100%;background:linear-gradient(#ff7a6e,var(--hp) 45%,#a82c24);transition:width .12s linear}
.bar.mp i{background:linear-gradient(#8ab8ff,var(--mp) 45%,#2c5cb0)}
.bar.xp{height:5px}.bar.xp i{background:var(--xp)}
.bar span{position:absolute;left:4px;top:0;bottom:0;font-size:11px;line-height:17px;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums;pointer-events:none}
.bar .pc{position:absolute;right:3px;top:0;bottom:0;display:flex;align-items:center;gap:2px;font-style:normal;font-size:11px;text-shadow:1px 1px 0 #000;pointer-events:none;font-variant-numeric:tabular-nums}
.bar .pc img{width:13px;height:13px;image-rendering:pixelated}
.goldrow{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.goldrow img{width:14px;height:14px;image-rendering:pixelated}
.goldrow .zone{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* classes à esquerda */
#classes{top:calc(126px + env(safe-area-inset-top,0px));left:max(10px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:7px;pointer-events:auto}
.cls{position:relative;width:56px;height:56px;padding:0;background:#1b1529;border:2px solid var(--edge);border-radius:3px;box-shadow:0 3px 0 #000;cursor:pointer;display:grid;place-items:center;color:var(--fg);touch-action:manipulation}
.cls:hover{border-color:var(--edge-hi)}
.cls.on{border-color:var(--gold);background:#2e2440;box-shadow:0 0 0 2px rgba(242,184,75,.3),0 3px 0 #000}
.cls .spr{width:34px;height:34px;margin-top:-8px}
.cls .cl{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:var(--muted);pointer-events:none}
.cls.on .cl{color:var(--gold)}
.cls .k{position:absolute;top:1px;left:3px;font-size:9px;color:var(--muted);pointer-events:none}
body.touch .cls .k{display:none}
.cls:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* minimapa e missão */
#tr{top:calc(10px + env(safe-area-inset-top,0px));right:max(10px, env(safe-area-inset-right,0px));width:min(200px,42vw);display:flex;flex-direction:column;gap:6px}
#mini{width:100%;max-width:100%;aspect-ratio:4/3;display:block;pointer-events:auto;cursor:pointer;image-rendering:auto}
#quest{padding:7px 9px;font-size:12px;line-height:1.3}
#quest .ql{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember)}
#qt{font-weight:700;font-size:13px;text-wrap:balance}
#qp{color:var(--muted);font-variant-numeric:tabular-nums}
#qp.done{color:var(--xp)}
/* chefe e alvo */
#boss{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(460px,36vw);text-align:center}
#bossname{font-size:16px;font-weight:700;color:#ffd0a0;text-shadow:2px 2px 0 #000;letter-spacing:.06em;margin-bottom:4px}
.bar.boss{height:14px;border:2px solid #000}.bar.boss i{background:linear-gradient(#ffb070,#d0402a 50%,#7a1a10)}
#target{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(220px,30vw);padding:5px 8px;text-align:center}
#target.low{top:calc(64px + env(safe-area-inset-top,0px))}
#tname{font-size:12px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){#tl{width:calc(55vw - 16px);padding:6px 7px;gap:4px 6px}#tr{width:calc(41vw - 14px)}.lv{width:30px;height:30px;font-size:14px}.bar .pc img{width:11px;height:11px}}
@media (max-width:820px){
  #boss{top:calc(150px + env(safe-area-inset-top,0px));width:min(460px,70vw)}
  #target,#target.low{top:auto;left:auto;transform:none;right:max(12px, env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(200px,50vw)}
}
/* habilidades */
#skills{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:max(12px, env(safe-area-inset-right,0px));display:flex;gap:7px;pointer-events:auto;align-items:flex-end}
.sk{position:relative;width:58px;height:58px;padding:0;background:#1b1529;border:2px solid var(--edge);border-radius:3px;color:var(--fg);cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 0 #000;touch-action:manipulation;overflow:hidden}
.sk:hover{border-color:var(--edge-hi)}
.sk:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.sk img{width:34px;height:34px;image-rendering:pixelated;pointer-events:none}
.sk .k{position:absolute;top:1px;left:3px;font-size:10px;color:var(--muted);pointer-events:none}
.sk .n{position:absolute;bottom:1px;right:3px;font-size:11px;font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:1px 1px 0 #000;color:#8ab8ff}
.sk .lk{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;color:var(--fg);background:rgba(5,3,10,.62);pointer-events:none;text-align:center;line-height:1.15}
.sk .cd{position:absolute;left:0;right:0;top:0;height:0;background:rgba(5,3,10,.72);pointer-events:none}
.sk.lowmp img{opacity:.4}
.sk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body.touch .sk .k{display:none}
#b-menu{border-color:var(--gold)}

@media (max-width:640px){.colwrap{grid-template-columns:minmax(0,1fr)}}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:flex;align-items:center;gap:8px;padding:8px;background:#1b1529;border:2px solid var(--edge);color:var(--fg);font-size:13px;cursor:pointer;border-radius:3px;text-align:left}
.layer.on{border-color:var(--gold)}
.layer i{width:18px;height:18px;border:2px solid #000;flex:none}
.pal{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px}
.sw{aspect-ratio:1;padding:0;border:2px solid #0d0b14;border-radius:2px;cursor:pointer;min-width:0}
.sw.on{outline:2px solid #fff;outline-offset:0}
.mobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.mob{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:start}
.mob>img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated;background:#0f0b18;border:2px solid var(--edge);border-radius:4px}
.mob b{font-size:15px}
.mob .meta{font-size:12px;color:var(--muted);margin:2px 0 6px}
.mob .drops{font-size:12px;line-height:1.45}
.setrow{display:flex;flex-wrap:wrap;gap:3px;margin:5px 0}
.setrow img{width:24px;height:24px;image-rendering:pixelated;background:#0f0b18;border:1px solid #2a2140;border-radius:3px}
.tab img{object-fit:contain}
#balert{pointer-events:auto;padding:6px 9px;font-size:12px;color:#ff8a7a;border-color:#a8241a;text-align:left;cursor:pointer;animation:bpulse 1.4s ease-in-out infinite}
@keyframes bpulse{50%{border-color:#ff5a4a;box-shadow:0 0 10px rgba(255,90,74,.5)}}
.cos .qmark{display:grid;place-items:center;width:40px;height:40px;font-size:24px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#balert{animation:none}}
#cine{position:fixed;inset:0;z-index:40;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
#cine .cb{position:absolute;left:0;right:0;background:#000}
#cine .ct{top:0;height:11vh}
#cine .cbt{bottom:0;min-height:21vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
#ctext{max-width:780px;margin:0;color:#f1e7d0;font:500 clamp(15px,2.3vw,21px)/1.5 Nunito,system-ui,sans-serif;text-align:center;min-height:3em;text-wrap:pretty}
#chint{margin-top:6px;color:#a597bd;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:opacity .3s;opacity:0}
#cskip{position:absolute;top:calc(11vh + 10px);right:max(14px, env(safe-area-inset-right,0px));padding:7px 12px;background:rgba(13,11,20,.75);color:#f1e7d0;border:2px solid #4a3d66;border-radius:4px;font:600 12px Nunito,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
body.incine .hud{display:none!important}
.dq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:2px solid var(--edge);border-radius:4px;background:#130f1e;margin-bottom:6px}
.dq small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.ach>div{padding:7px 9px;border:2px solid var(--edge);border-radius:4px;background:#130f1e;font-size:13px}
.ach>div.ok{border-color:#8a6a1e;background:#1e1810}
.ach small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.packi{width:56px;height:56px;image-rendering:pixelated;background-color:#0f0b18;background-repeat:no-repeat;background-position:0 0;border:2px solid var(--edge);border-radius:4px}

  else if(s.dano)it.dmgp=num(s.dano)/100;
  if(s.critico)it.crit=num(s.critico)/100;if(s.alcance)it.range=num(s.alcance);if(s.mana)it.mp=num(s.mana);if(s.defesa)it.def=num(s.defesa);if(s.vida)it.hp=num(s.vida);

function solidAt(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=MW||ty>=MH)return true;return SOLIDS[map[I(tx,ty)]]===1}
function blockedP(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=MW||ty>=MH)return true;return PBLOCK[map[I(tx,ty)]]===1}
function hits(x,y,r){return solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r)}
function moveEnt(e,dx,dy){let moved=false;if(dx&&!hits(e.x+dx,e.y,e.r)){e.x+=dx;moved=true}if(dy&&!hits(e.x,e.y+dy,e.r)){e.y+=dy;moved=true}return moved}
const passable=k=>!SOLIDS[map[k]];
function nearestPassable(tx,ty){tx=clamp(tx,0,MW-1);ty=clamp(ty,0,MH-1);if(passable(I(tx,ty)))return I(tx,ty);for(let r=1;r<=5;r++){let best=-1,bd=1e9;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=tx+dx,y=ty+dy;if(x<0||y<0||x>=MW||y>=MH)continue;const k=I(x,y);if(passable(k)){const d=dx*dx+dy*dy;if(d<bd){bd=d;best=k}}}if(best>=0)return best}return -1}

function findPath(sx,sy,tx,ty){const s=nearestPassable(Math.floor(sx/T),Math.floor(sy/T));let t=nearestPassable(Math.floor(tx/T),Math.floor(ty/T));if(s<0||t<0)return null;
  let exact=t===I(clamp(Math.floor(tx/T),0,MW-1),clamp(Math.floor(ty/T),0,MH-1))&&!hits(tx,ty,P.r);
  if(s===t)return[{x:exact?tx:(t%MW)*T+8,y:exact?ty:((t/MW)|0)*T+8}];
  PG.fill(1e9);PV.fill(0);PC.fill(-1);const heap=[];const push=(f,k)=>{heap.push([f,k]);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p}};
  const pop=()=>{const top=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let i=0;for(;;){const a=i*2+1,b=a+1;let m=i;if(a<heap.length&&heap[a][0]<heap[m][0])m=a;if(b<heap.length&&heap[b][0]<heap[m][0])m=b;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return top};
  const tx0=t%MW,ty0=(t/MW)|0;const hh=k=>{const dx=Math.abs(k%MW-tx0),dy=Math.abs(((k/MW)|0)-ty0);return Math.max(dx,dy)+0.414*Math.min(dx,dy)};
  PG[s]=0;push(hh(s),s);let found=false,n=0,best=s,bh=hh(s);
  while(heap.length&&n<26000){const[,k]=pop();if(PV[k])continue;PV[k]=1;n++;if(k===t){found=true;break}{const hv=hh(k);if(hv<bh){bh=hv;best=k}}const x=k%MW,y=(k/MW)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const nk=I(nx,ny);if(!passable(nk)||PV[nk])continue;if(dx&&dy&&(!passable(I(x+dx,y))||!passable(I(x,y+dy))))continue;const ng=PG[k]+(dx&&dy?1.414:1);if(ng<PG[nk]){PG[nk]=ng;PC[nk]=k;push(ng+hh(nk),nk)}}}
  if(!found){if(best===s)return null;t=best;exact=false}const out=[];let k=t;while(k!==s&&k>=0){out.push({x:(k%MW)*T+8,y:((k/MW)|0)*T+8});k=PC[k]}out.reverse();if(exact&&out.length){out[out.length-1]={x:tx,y:ty}}return out}

  else{old=S.eq[it.slot];if(it.slot==='backpack'){const used=bagUsed()-1+(old?1:0);if(used>18+it.cap){toast('Essa mochila é pequena demais para o que você carrega.','#ff7a6e');return false}}S.inv.splice(i,1);S.eq[it.slot]=it;if(old)S.inv.splice(i,0,old)}

  banner(`Onda ${r.wave} de 3`,'Derrote todos os monstros da fenda');sfx('nova');burst(r.x,r.y-6,['#c36bff','#1b1420','#f0c8ff'],40,120,0.7,2)}

/* ---- missões diárias ---- */
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const FAMN={slime:'slimes',goblin:'goblins',zombie:'zumbis',skeleton:'esqueletos',golem:'golens de obsidiana',imp:'diabretes',wolf:'lobos das neves',barbarian:'bárbaros do gelo',yeti:'yetis',scorpion:'escorpiões',mummy:'múmias',sandgolem:'guardiões de arenito',shade:'sombras',cultist:'cavaleiros do vazio',devourer:'devoradores'};
function genDaily(){let h=0;for(const ch of dayKey())h=(h*31+ch.charCodeAt(0))|0;const r=mulberry(h^S.lvl);const zs=riftZones();const zt=zs[Math.floor(r()*zs.length)];
  const fams=[...new Set(ZPOP[zt].map(x=>ED[x[0]].fam))];const fam=fams[Math.floor(r()*fams.length)];
  const pool=[{k:'kill',m:fam,n:15+Math.floor(r()*4)*5,t:`Derrote ${FAMN[fam]||fam} em ${ZN[zt]}`},{k:'kill',m:'any',n:60,t:'Derrote 60 monstros em qualquer região'},{k:'chest',n:3,t:'Abra 3 baús pelo mundo'},{k:'elite',n:2,t:'Derrote 2 monstros campeões (nome dourado)'},{k:'rift',n:1,t:'Feche 1 Fenda Sombria'}];
  if(S.lvl>=15)pool.push({k:'boss',n:1,t:'Derrote qualquer chefe'});
  const out=[];const used=new Set();out.push(pool[0]);used.add(0);while(out.length<3){const i=1+Math.floor(r()*(pool.length-1));if(used.has(i))continue;used.add(i);out.push(pool[i])}
  S.daily={d:dayKey(),list:out.map(q=>Object.assign({},q,{p:0,claimed:false,rw:{g:40+S.lvl*12,xp:Math.round(xpNeed(S.lvl)*0.2),dia:q.k==='boss'||q.k==='rift'?3:2}}))}}
function dailyList(){if(!S.daily||S.daily.d!==dayKey())genDaily();return S.daily.list}
function dEvent(kind,m){for(const q of dailyList()){if(q.claimed||q.p>=q.n||q.k!==kind)continue;if(kind==='kill'&&q.m!=='any'&&q.m!==m)continue;q.p++;if(q.p>=q.n){toast(`Diária concluída: ${q.t}. Receba no menu, aba Missões.`,'#8bd86a');sfx('lvl')}}}

    <div class="row" style="margin-top:8px"><button class="btn" data-act="buyp" data-id="sc1" ${S.gold<25?'disabled':''}>Pergaminho de Retorno, 25</button></div>`)}`)}
  else if(id==='doran')openShop();else if(id==='torrin')openForge();else if(id==='olga')openBank();else if(id==='varek')openTrainer();else if(id==='sena')openTravel();else if(id==='mabel')openTavern()}
let shopTab='buy';

function restock(){const l=S.lvl,rs=l>=10?[0,1,1,2,2,3]:l>=5?[0,0,1,1,2,2]:[0,0,0,1,1,2],L=Math.max(3,l);S.shop={t:Date.now(),items:rs.map(r=>{const it=packOrGen(r,L);it.price=Math.round(it.val*4+30);return it})}}
function openShop(){mode='modal';const st=shopStock();const left=Math.max(0,300-Math.floor((Date.now()-st.t)/1000));const mm=Math.floor(left/60),ss=String(left%60).padStart(2,'0');

function openForge(){mode='modal';const eqd=[...CLS_ORDER.map(c=>[S.weapons[c],'Arma de '+CLASSES[c].n]),...Object.keys(S.eq).filter(k=>S.eq[k]&&k!=='backpack').map(k=>[S.eq[k],'Equipado'])];

function openBank(){mode='modal';const g=S.gold,b=S.bank.gold;

function openGroundItem(g){mode='modal';const it=g.it,cmp=counterpart(it),cls=clsOf(it),b=it.ref?DBI[it.ref]:null;const far=hyp(g.x-P.x,g.y-P.y)>14;

/* ================= menu (Atributos, Inventário, Aparência...) ================= */
const menuEl=$('menu'),mbody=$('mbody');let menuTab='stats',sel=null,invFilter='all',resetAsk=false,lookCls=null,lookMode='parts',colLayer=0,buyAsk=null;
const MOBICON={};const mobIcon=k=>MOBICON[k]||(MOBICON[k]=SP2[k].f[0].toDataURL());
let heroTabIcon='';
const TABS=()=>[['stats','Atributos',ICON.star],['inv','Inventário',ICON.bag],['look','Aparência',heroTabIcon],['skills','Habilidades',ICON.fire],['mobs','Monstros',mobIcon('sk0')],['quests','Missões',ICON.scroll],['map','Mapa',ICON.map],['opts','Opções',ICON.gear]];
function openMenu(tab){if(mode==='title'||P.dead)return;if(tab)menuTab=tab;mode='modal';resetAsk=false;buyAsk=null;lookCls=S.cls;heroTabIcon=heroSheet(S.cls,S.look[S.cls]).down.idle[0].toDataURL();menuEl.hidden=false;renderMenu()}

function renderMenu(){$('tabs').innerHTML=TABS().map(([k,n,ic])=>`<button class="tab${menuTab===k?' on':''}" data-tab="${k}"><img src="${ic}" alt="">${n}</button>`).join('');
  const st=stats();let h='';
  if(menuTab==='stats')h=statsHTML(st);else if(menuTab==='inv')h=invHTML(st);else if(menuTab==='look')h=lookHTML();else if(menuTab==='skills')h=skillsHTML();else if(menuTab==='mobs')h=mobsHTML();else if(menuTab==='quests')h=questsHTML();

  else h=`<div class="pnl" style="max-width:760px"><h4>Opções</h4><div class="row"><button class="btn pri" data-act="mclose">Voltar ao jogo</button><button class="btn" data-act="save">Salvar agora</button><button class="btn" data-act="sound">Som: ${soundOn?'ligado':'desligado'}</button><button class="btn" data-act="cine">Ver a abertura</button><button class="btn pri" data-act="online">Jogar online</button><button class="btn" data-act="p2">${P2.on?'Jogador 2: sair':'Jogador 2: entrar'}</button><button class="btn" data-act="askreset">Novo jogo</button></div><p class="muted" style="font-size:13px">Multijogador local: dois jogadores no mesmo PC. O Jogador 2 usa as setas para andar, Enter para atacar, Shift direito para dash, / . , para as habilidades e \\ para trocar de classe. Com um controle (joystick) conectado, basta apertar Start. Os chefes mais fortes precisam de 2 ou mais jogadores.</p>${resetAsk?`<p>Isso apaga todo o progresso salvo, inclusive o banco e as aparências.</p><button class="btn pri" data-act="reset">Confirmar novo jogo</button>`:''}<h3>Como jogar</h3>${CONTROLS}</div>`;
  if(menuTab==='map'&&MAPSEL){const tx=clamp(Math.floor(MAPSEL.x/T),0,MW-1),ty=clamp(Math.floor(MAPSEL.y/T),0,MH-1),z=zmap[I(tx,ty)],far=Math.round(hyp(MAPSEL.x-P.x,MAPSEL.y-P.y)/T);const cav=ty>=SURF&&P.y<SURF*T?' Fica numa caverna: o herói vai até onde der; entre pela boca de caverna.':'';h=h.replace('<div class="legend">',`<div class="mapgo"><span>${ZN[z]} · ${far} passos daqui.${cav}</span><button class="btn pri" data-act="mapgo">Ir até aqui</button><button class="btn" data-act="mapno">Cancelar</button></div><div class="legend">`)}

function barRow(label,val,bonus,frac,col,cap){return`<div class="msr"><div class="mst"><b>${label}</b><span>${val}${bonus?` <em class="up">+ ${bonus}</em>`:''}</span></div><div class="bar"><i style="width:${(clamp(frac,0,1)*100).toFixed(1)}%;background:${col}"></i></div>${cap?`<small>${cap}</small>`:''}</div>`}
function statsHTML(st){const need=xpNeed(S.lvl);const cs=CLS_ORDER.map(c=>[c,statsFor(c)]);

function slotHTML(it,key,label,extra=''){const isSel=sel===key;return`<button class="slot2 ${it?'rb'+it.rar:'empty'}${isSel?' sel':''} ${extra}" data-sel="${key}" aria-label="${label}">${it?itemSpr(it):''}${it?`<span class="pw2">${power(it)}</span>`:''}${it&&it.up?`<span class="upb">+${it.up}</span>`:''}<span class="sl">${label}</span></button>`}

  const shown=cons.length+(invFilter==='cons'?0:items.length);const empty=Math.max(0,(invFilter==='all'?bagCap():Math.max(12,Math.ceil(shown/6)*6))-shown);for(let i=0;i<empty;i++)cells+='<button class="cell" disabled aria-hidden="true"></button>';

  case'restock':if(S.gold>=50){S.gold-=50;restock();sfx('coin')}openShop();restore();break;
  case'buykey':if(S.gold>=150){S.gold-=150;S.keys++;sfx('chest');toast('+1 Chave de Cripta','#e0b040');save()}openShop();restore();break;
  case'buy':{const st=shopStock(),i=st.items.findIndex(x=>x.id===id);if(i>=0){const it=st.items[i];if(S.gold>=it.price&&!bagFull()){S.gold-=it.price;st.items.splice(i,1);const c=Object.assign({},it);delete c.price;c.id=uid();S.inv.unshift(c);sfx('chest');toast(`Comprou: ${dname(c)}`,RCOL[c.rar]);save()}}openShop();restore();break}
  case'sell':{const i=S.inv.findIndex(x=>x.id===id);if(i>=0){S.gold+=sellVal(S.inv[i]);S.inv.splice(i,1);sfx('coin');save()}openShop();restore();break}
  case'sellcommon':{for(const it of S.inv.filter(i=>i.rar===0))S.gold+=sellVal(it);S.inv=S.inv.filter(i=>i.rar!==0);sfx('coin');save();openShop();break}
  case'reforge':{const it=findItem(id);if(it){const c=reforgeCost(it);if(S.gold>=c){S.gold-=c;reforgeItem(it);sfx('anvil');shake(2);toast(`Reforjado: ${statLine(it)}`,RCOL[it.rar]);clampVitals();save()}}openForge();restore();break}
  case'ascend':{const it=findItem(id);if(it&&!it.ref&&it.rar<4){const c=ascendCost(it);if(S.gold>=c){S.gold-=c;ascendItem(it);sfx('lvl');shake(3);toast(`${dname(it)} agora é ${RAR[it.rar]}!`,RCOL[it.rar]);clampVitals();save()}}openForge();restore();break}
  case'travel':doTravel(+id);break;
  case'fuse':fuseItems(+id);openForge();restore();break;
  case'gamble':gamble();restore();break;
  case'food':buyFood(+id);openTavern();restore();break;
  case'sendoffer':offerItem(id,($('tprice')||{}).value);break;
  case'tacc':tradeAccept();break;
  case'tdec':tradeDecline();break;
  case'sellunc':{for(const it of S.inv.filter(i=>i.rar===1))S.gold+=sellVal(it);S.inv=S.inv.filter(i=>i.rar!==1);sfx('coin');save();openShop();break}
  case'upgrade':{const it=findItem(id);if(it&&(it.up||0)<10){const c=upCost(it);if(S.gold>=c){S.gold-=c;it.up=(it.up||0)+1;if(it.up>=10)S.st.up10=1;sfx('anvil');shake(2);toast(`${dname(it)}!`,RCOL[it.rar]);clampVitals();save()}}openForge();restore();break}
  case'dep':{const v=id==='all'?S.gold:Math.min(S.gold,+id);S.gold-=v;S.bank.gold+=v;sfx('coin');save();openBank();restore();break}
  case'wd':{const v=id==='all'?S.bank.gold:Math.min(S.bank.gold,+id);S.bank.gold-=v;S.gold+=v;sfx('coin');save();openBank();restore();break}
  case'bankin':{const i=S.inv.findIndex(x=>x.id===id);if(i>=0&&S.bank.items.length<40){S.bank.items.unshift(S.inv.splice(i,1)[0]);sfx('chest');save()}openBank();restore();break}
  case'bankout':{const i=S.bank.items.findIndex(x=>x.id===id);if(i>=0&&!bagFull()){S.inv.unshift(S.bank.items.splice(i,1)[0]);sfx('chest');save()}openBank();restore();break}
  }});

/* ================= início ================= */
function startGame(saved){S=Object.assign(freshState(),saved||{});S.eq=Object.assign(emptyEq(),S.eq||{});S.weapons=Object.assign(freshWeapons(),S.weapons||{});S.pot=Object.assign({hp:0,mp:0},S.pot||{});S.bank=Object.assign({gold:0,items:[]},S.bank||{});
  const conv=S._conv;delete S._conv;Object.assign(P,{dead:false,actT:0,hitT:0,dirName:'down',path:null,goal:null,target:null,dash:null,cd:{},buff:{roar:0,agile:0},mark:null,chan:0});
  for(const c of chests){c.open=S.chests.includes(c.id);c.unlocked=c.open}for(const c of bossChests)if(c.rift)map[I(c.tx,c.ty)]=pmap[I(c.tx,c.ty)];bossChests=[];rift=null;for(const a of ARENAS)if(map[I(a.x,a.y)]===HOUSE)map[I(a.x,a.y)]=FLOOR;for(let i=0;i<BD.length;i++)if(S.bossT&&S.bossT[i]===0)S.bossT[i]=1;
  ground=(S.ground||[]).map(g=>({id:uid(),it:g.it,x:g.x,y:g.y,t:1}));
  if(saved&&typeof S.x==='number'&&!solidAt(S.x,S.y)){P.x=S.x;P.y=S.y}else{P.x=SPAWN.x;P.y=SPAWN.y}P.pet.x=P.x-10;P.pet.y=P.y;
  if(!saved){const st=stats();S.hp=st.mhp;S.mp=st.mmp}
  boss=null;projs=[];teles=[];drops=[];rains=[];curZone=null;fillWorld();makeDummies();cam.x=P.x;cam.y=P.y;P.invT=1;closeModal();zoneCheck();updateClassBtns();updateSkillBtns();save();
  setTimeout(()=>{for(const c of CLS_ORDER)heroSheet(c,S.look[c])},50);
  if(!saved){if(!S.cine)startCine(()=>banner('Vila de Eldmor','Toque no Ancião Bram, de barba branca, para começar'));else banner('Vila de Eldmor','Toque no Ancião Bram, de barba branca, para começar')}else toast('Aventura carregada','#8bd86a');
  if(conv)setTimeout(()=>toast(`Itens antigos que não existem mais viraram ${conv} de ouro.`,'#f2b84b'),400)}

/* ================= entrada ================= */
let isTouch=false,drag=null;
function setTouch(v){if(isTouch===v)return;isTouch=v;document.body.classList.toggle('touch',v)}
try{if(matchMedia('(pointer:coarse)').matches)setTouch(true)}catch(e){}
addEventListener('keydown',e=>{const c=e.code;if(mode==='cine'){e.preventDefault();if(c==='Escape')endCine();else if(c==='Space'||c==='Enter'||c==='ArrowRight')cineNext();return}if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(c)&&mode!=='title')e.preventDefault();unlockAudio();
  if(mode==='modal'||mode==='title'){if(mode==='modal'&&!menuEl.hidden){if(['Escape','KeyI','Tab','KeyM','KeyC'].includes(c))closeMenu();return}if((c==='Escape')&&mode==='modal'&&!$('m-respawn'))closeModal();return}
  keys[c]=true;if(e.repeat)return;setTouch(false);
  switch(c){case'KeyQ':cast(0);break;case'KeyE':cast(1);break;case'KeyR':cast(2);break;case'Digit1':setClass('warrior');break;case'Digit2':setClass('mage');break;case'Digit3':setClass('archer');break;case'KeyF':interactNearest();break;case'Enter':if(!P2.on)interactNearest();break;case'Space':doDash();break;case'KeyZ':usePotion('hp');break;case'KeyX':usePotion('mp');break;case'KeyT':useScroll();break;case'KeyI':case'Tab':openMenu('inv');break;case'KeyC':openMenu('stats');break;case'KeyM':openMenu('map');break;case'KeyH':openMenu('skills');break;case'Escape':openMenu('opts');break}});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',keysReset);
function screenToWorld(sx,sy){return{x:(sx-W/2)/SCALE+cam.x,y:(sy-H/2)/SCALE+cam.y}}
function enemyAt(x,y){let b=null,bd=1e9;for(const e of foes()){const h=e.boss?BOSSH(e)+6:e.sh,cyy=e.y+e.r-h/2,rr=Math.max(10,(e.boss?e.r+6:h/2+3));const d=hyp(x-e.x,y-cyy);if(d<rr&&d<bd){bd=d;b=e}}return b}
function groundAt(x,y){let b=null,bd=10;for(const g of ground){const d=hyp(x-g.x,y-(g.y-7));if(d<bd){bd=d;b=g}}return b}
function chestAt(x,y){for(const c of allChests())if(!c.open&&Math.abs(x-c.x)<13&&y>c.y-24&&y<c.y+5)return c;return null}
function npcAt(x,y){for(const n of NPCS)if(Math.abs(x-n.x)<11&&y>n.y-30&&y<n.y+6)return n;return null}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{unlockAudio();if(mode!=='play'||P.dead||P.chan)return;setTouch(e.pointerType==='touch'||e.pointerType==='pen');const w=screenToWorld(e.clientX,e.clientY);
  if(e.button===2){P.aim={x:w.x,y:w.y};P.aimT=time;P.aimEn=enemyAt(w.x,w.y);if(P.aimEn)P.target=P.aimEn;cast(0);return}
  const en=enemyAt(w.x,w.y);if(en){P.target=en;P.goal=null;P.path=null;P.repath=0;P.mark=null;return}
  const gi=groundAt(w.x,w.y);if(gi){openGroundItem(gi);return}
  const ch=chestAt(w.x,w.y);if(ch){P.target=null;walkTo(ch.x,ch.y+4,{kind:'chest',o:ch,r:24});return}
  const np=npcAt(w.x,w.y);if(np){P.target=null;walkTo(np.x,np.y+6,{kind:'npc',o:np,r:26});return}
  {const F=STRO.find(o=>o.kind==='fountain');if(Math.abs(w.x-F.x)<17&&w.y>F.y-34&&w.y<F.y+2){toast('Uma inscrição gasta na borda da fonte: “Lâmina, cajado, arco... e de volta pelo mesmo caminho.”','#bfe3f5');return}
    for(const dy of[0,1]){const tx=Math.floor(w.x/T),ty=Math.floor(w.y/T)+dy;if(tx<0||ty<0||tx>=MW||ty>=MH)continue;const k=I(tx,ty),o=objAt[k];if(o&&o.kind==='grave'&&Math.abs(w.x-o.x)<8&&w.y<o.y+2&&w.y>o.y-14){toast(EGG_GRAVE&&k===EGG_GRAVE.k?'Na lápide: “Aqui jaz Elric, o curandeiro. Curou a vila inteira, mas ninguém esteve lá para curá-lo.”':'Na lápide: “'+EPITAPHS[k%EPITAPHS.length]+'”','#c8ccd4');return}}}
  P.target=null;walkTo(w.x,w.y);drag={id:e.pointerId,t:performance.now()};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){const now=performance.now();if(now-drag.t>140){drag.t=now;const w=screenToWorld(e.clientX,e.clientY);P.goal=null;P.path=findPath(P.x,P.y,w.x,w.y);P.mark={x:w.x,y:w.y,t:0.5}}return}
  if(e.pointerType==='mouse'&&mode==='play'){const w=screenToWorld(e.clientX,e.clientY);mouseW={x:w.x,y:w.y,t:time};cv.style.cursor=enemyAt(w.x,w.y)?'crosshair':(groundAt(w.x,w.y)||chestAt(w.x,w.y)||npcAt(w.x,w.y))?'pointer':'default'}});
const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
mini.addEventListener('pointerdown',e=>{e.stopPropagation();unlockAudio();if(mode!=='play'||P.dead)return;openMenu('map')});
$('hpbar').addEventListener('click',()=>{unlockAudio();usePotion('hp')});$('mpbar').addEventListener('click',()=>{unlockAudio();usePotion('mp')});
for(const c of CLS_ORDER)$('c-'+c).addEventListener('click',e=>{unlockAudio();if(mode==='play')setClass(c);e.currentTarget.blur()});
for(let i=0;i<3;i++)$('b-s'+i).addEventListener('click',e=>{unlockAudio();cast(i);e.currentTarget.blur()});
$('b-menu').addEventListener('click',()=>{unlockAudio();if(mode==='play')openMenu('inv')});
$('cine').addEventListener('click',()=>{unlockAudio();cineNext()});$('cskip').addEventListener('click',e=>{e.stopPropagation();endCine()});
$('q-hp').addEventListener('click',e=>{unlockAudio();usePotion('hp');e.currentTarget.blur()});$('q-mp').addEventListener('click',e=>{unlockAudio();usePotion('mp');e.currentTarget.blur()});$('b-dash').addEventListener('click',e=>{unlockAudio();doDash();e.currentTarget.blur()});
addEventListener('gamepadconnected',()=>{if(mode!=='title')toast('Controle conectado: aperte Start para o Jogador 2 entrar.','#6ad8ff')});
$('balert').addEventListener('click',()=>{unlockAudio();if(mode==='play')openMenu('map')});
$('b-stats').addEventListener('click',()=>{unlockAudio();if(mode==='play')openMenu('stats')});
$('hpi').src=ICON.php;$('mpi').src=ICON.pmp;$('q-hp').querySelector('img').src=ICON.php;$('q-mp').querySelector('img').src=ICON.pmp;$('b-dash').querySelector('img').src=bake(30,30,g=>{iconDraw(g,'boots',GENPAL[2]);for(let i=0;i<3;i++)R_(g,'#e8f4ff',1,9+i*5,6-i,1.4)},{amt:0.15}).toDataURL();$('goldi').src=ICON.gold;$('diai').src=iconURL('dia');$('b-menu').querySelector('img').src=ICON.bag;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode!=='title')save()});

/* ================= laço ================= */
fillWorld();makeDummies();updateClassBtns();updateSkillBtns();openTitle();
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);update(dt);render();if(dt<0.034)prepaintNear(cam.x,cam.y,2,1);menuPreview();hudT-=dt;if(hudT<=0){hudT=1/15;hud();if(!menuEl.hidden&&menuTab==='map')drawBigMap()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);

})();
